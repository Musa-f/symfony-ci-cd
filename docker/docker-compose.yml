services:

  db:
    container_name: mariadb
    image: mariadb:latest
    volumes:
      - ../mysql:/var/lib/mysql
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: symfony
      MARIADB_USER: symfony
      MARIADB_PASSWORD: symfony
    networks:
      - symfony-network

  app:
    container_name: symfony
    image: alievna/ressources-relationnelles
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - symfony-network

  adminer:
    container_name: adminer
    image: adminer
    restart: always
    ports:
      - 3307:8080
    networks:
      - symfony-network

networks:
  symfony-network:
