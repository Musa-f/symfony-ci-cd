name: Deploy to Preprod Server

on:
  push:

jobs:
  merge-branch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Fetch all branches and tags from origin
        run: git fetch --prune --unshallow

      - name: Checkout develop branch
        run: |
          git checkout develop

      - name: Create or update release branch
        run: |
          if git show-ref --verify --quiet refs/heads/release; then
            git checkout release
            git pull origin release 
            git merge develop --no-ff -m "Merging changes from develop to release"
          else
            git checkout -b release develop
          fi
          
      - name: Push release branch
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          git remote set-url origin https://x-access-token:${PAT}@github.com/${{ github.repository }}
          git push origin release

  update-docker:
    runs-on: ubuntu-latest
    needs: merge-branch 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build -t alievna/ressources-relationnelles:${GITHUB_SHA} -f ./docker/Dockerfile .
          docker push alievna/ressources-relationnelles:${GITHUB_SHA}

  update-server:
    runs-on: ubuntu-latest
    needs: update-docker

    steps:
      - name: SSH into server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          script: |
            cd symfony-ci-cd/docker
            docker pull alievna/ressources-relationnelles:${GITHUB_SHA}
            docker compose up -d


