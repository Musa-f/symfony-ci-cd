name: PHPUnit Tests

on:
    workflow_call

jobs:

  test-services:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install dependencies
        uses: php-actions/composer@v6

      - name: Run PHPUnit tests
        run: php ./vendor/bin/phpunit --testsuite=Services --configuration tests/phpunit.xml

  test-routes:
    needs: [test-services]
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.5
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: symfony_test
          MARIADB_USER: symfony
          MARIADB_PASSWORD: symfony
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Start MariaDB
        run: |
          for i in `seq 1 30`; do
            if mysqladmin ping -h "127.0.0.1" --silent; then
              echo "MariaDB is ready!"
              break
            fi
            echo 'Waiting for MariaDB...'
            sleep 2
          done

      - name: Install dependencies
        uses: php-actions/composer@v6

      - name: Prepare database
        env:
          DATABASE_URL: mysql://symfony:symfony@127.0.0.1:3306/symfony_test
        run: |
          php bin/console doctrine:schema:update --force
          php bin/console doctrine:fixtures:load --no-interaction

      - name: Run PHPUnit tests
        run: php ./vendor/bin/phpunit --testsuite=Controllers --configuration tests/phpunit.xml
